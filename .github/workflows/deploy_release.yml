name: Deploy main branch to Cloud Run as production
on:
  push: 
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      meta: ${{ steps.meta.outputs.json }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Authenticate to Google Cloud
      id: auth
      uses: ./.github/actions/gcp-auth
      with:
        token_format: 'access_token'

    - name: Login to pkg.dev
      uses: docker/login-action@v4
      with:
        registry: us-west1-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Generate docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: us-west1-docker.pkg.dev/redflare-prod/avatars-console/redflare

    - name: Build and push
      id: build-push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            SOURCE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
  
  migrate:
    uses: ./.github/workflows/migrate-db.yml
    needs: build
    permissions:
      contents: read
      id-token: write
    with:
      env: production
    secrets: inherit
  
  deploy-production-canary:
    uses: ./.github/workflows/cloudrun-deploy.yml
    needs: build
    permissions:
      contents: read
      id-token: write
    with:
      image: us-west1-docker.pkg.dev/redflare-prod/avatars-console/redflare@${{ needs.build.outputs.digest }}
      env: production
      strategy: canary
    secrets: inherit

  test-e2e:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: 'read'
      id-token: 'write'
    needs:
      - build
      - deploy-production-canary
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Auth Cloud SDK
        if: always()
        uses: ./.github/actions/gcp-auth

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: 'cloud-run-proxy'

      - name: Start canary proxy
        run: |
          gcloud run services proxy ${{ vars.SERVICE_NAME }}-canary \
            --region=us-west1 --port=8080 &
          echo $! > /tmp/gcloud-proxy.pid
          for i in {1..10}; do
            nc -z localhost 8080 && break || sleep 1
          done
          bunx local-ssl-proxy --source 3000 --target 8080 &
          echo $! > /tmp/ssl-proxy.pid
          for i in {1..10}; do
            nc -z localhost 3000 && break || sleep 1
          done

      - name: Run E2E tests
        env:
          CI: true
          FORCE_REMOTE: true
          TEST_URL: https://localhost:3000
        run: bun test:e2e

      - name: Stop canary proxy
        if: always()
        run: |
          kill $(cat /tmp/ssl-proxy.pid) || true
          kill $(cat /tmp/gcloud-proxy.pid) || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

      - name: Delete canary service
        if: always()
        run: gcloud run services delete ${{ vars.SERVICE_NAME }}-canary --region=us-west1 --quiet || true

  rollback-migrations:
    runs-on: ubuntu-latest
    environment: production
    needs: [migrate, test-e2e]
    if: failure() && needs.test-e2e.result == 'failure'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: bun run scripts/rollback.ts ${{ needs.migrate.outputs.applied_count }}
  
  deploy-production:
    uses: ./.github/workflows/cloudrun-deploy.yml
    needs: [build, test-e2e]
    permissions:
      contents: read
      id-token: write
    with:
      image: us-west1-docker.pkg.dev/redflare-prod/avatars-console/redflare@${{ needs.build.outputs.digest }}
      env: production
      strategy: direct
    secrets: inherit

  promote-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://avatars-console.xaeky.cloud
    permissions:
      contents: read
      id-token: write
    needs: deploy-production
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gcp-auth

      - name: Send all traffic to this new version
        run: gcloud run services update-traffic ${{ vars.SERVICE_NAME }} --to-latest --region=us-west1 --quiet